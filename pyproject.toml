[project]
name = "flowpilot"
version = "0.1.0"
description = "AI-powered browser automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "docker>=7.0.0",
    "browser-use>=0.13.11,<0.14.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "aiosqlite>=0.19.0",
    "cdp-use>=1.4.5",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires a running application, browser and configured LLM provider"]

# Coordinated security amendment: browser-use remains 0.13.11. These replace its
# exact upstream pins (and browser-harness's Pillow pin), not just constrain them.
# Compatibility evidence/limits: tests/test_dependency_compatibility.py and plan005.
[tool.uv]
override-dependencies = [
    "aiohttp==3.14.4",
    "anyio==4.14.2",
    "mcp==2.2.0",
    "pillow==13.0.0",
    "pypdf==6.19.0",
]
