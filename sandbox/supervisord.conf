[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

; ── Xvfb virtual framebuffer ─────────────────────────────────────────
; Chromium renders better with a display even when using CDP screencast.
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset
user=sandboxuser
autorestart=true
priority=10
; Give Xvfb time to open its socket before Chromium tries to connect to :1
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── Chromium with remote debugging ──────────────────────────────────
[program:chromium]
command=/usr/bin/chromium \
    --no-sandbox \
    --disable-dev-shm-usage \
    --use-gl=swiftshader \
    --remote-debugging-port=9222 \
    --remote-debugging-address=0.0.0.0 \
    --remote-allow-origins=* \
    --user-data-dir=/tmp/chrome-profile \
    --window-size=1920,1080
environment=DISPLAY=":1"
user=sandboxuser
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── CDP forwarder ────────────────────────────────────────────────────
; Chromium ignores --remote-debugging-address=0.0.0.0 on some builds (ARM).
; socat exposes CDP on 0.0.0.0:9223 for cross-container access.
[program:cdp-forward]
command=socat TCP-LISTEN:9223,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9222
user=sandboxuser
autorestart=true
priority=30
startsecs=1
stdout_logfile=/var/log/supervisor/cdp-forward.log
stderr_logfile=/var/log/supervisor/cdp-forward-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
