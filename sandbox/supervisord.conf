[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

; ── Xvfb virtual framebuffer ─────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── Fluxbox window manager ───────────────────────────────────────────
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=20
; Wait for Xvfb to be ready
startsecs=3
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── TigerVNC server ──────────────────────────────────────────────────
; x0vncserver attaches to an existing X display (started by Xvfb)
[program:vnc]
command=/usr/bin/x0vncserver -display :1 -rfbport 5900 -PasswordFile /root/.vnc/passwd
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── websockify + noVNC ───────────────────────────────────────────────
; Serves the noVNC web client on port 6080 and proxies WebSocket to VNC on 5900
[program:novnc]
command=/usr/local/bin/websockify --web /opt/noVNC %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

; ── Chromium with remote debugging ─────────────────────────────────────
[program:chromium]
command=/usr/bin/chromium --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --user-data-dir=/tmp/chrome-profile --start-maximized
environment=DISPLAY=":1"
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium-err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
