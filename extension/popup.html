<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #fff;
      width: 340px;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #afafaf;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #afafaf;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      background: #282828;
      color: #fff;
      border: 1px solid transparent;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus {
      border-color: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 500px;
      cursor: pointer;
      transition: background 0.3s ease, opacity 0.3s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #fff;
      color: #000;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e2e2e2;
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid #6b6b6b;
      margin-top: 8px;
    }

    .btn-outline:hover:not(:disabled) {
      border-color: #fff;
    }

    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }

    .status.success {
      color: #06C167;
    }

    .status.error {
      color: #e74c3c;
    }

    .status.info {
      color: #afafaf;
    }

    .hint {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #6b6b6b;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #6b6b6b;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logged-in-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .logged-in-bar .name {
      color: #e2e2e2;
    }

    .logged-in-bar .logout-link {
      background: none;
      border: none;
      color: #6b6b6b;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }

    .logged-in-bar .logout-link:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="logo">
    <h1>uber<span>-bookr</span></h1>
  </div>

  <!-- Auth section -->
  <div id="auth-section">
    <div class="input-group">
      <label>Backend URL</label>
      <input type="text" id="backend-url" placeholder="http://localhost:8080" />
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" />
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="Password" />
    </div>

    <button class="btn btn-primary" id="login-btn">Log in & Connect</button>

    <div class="status" id="auth-status"></div>

    <div class="hint">
      Log in to your uber-bookr account, then your Uber session will be synced automatically.
    </div>
  </div>

  <!-- Connected section (shown after auth + sync) -->
  <div id="connected-section" class="hidden">
    <div class="logged-in-bar">
      <span class="name" id="connected-user-name"></span>
      <button class="logout-link" id="ext-logout-btn">Log out</button>
    </div>

    <button class="btn btn-primary" id="resync-btn">Re-sync Uber Session</button>

    <div class="status" id="connect-status"></div>

    <div class="hint">
      Navigate to any uber.com page and click Re-sync to update your session.
    </div>
  </div>

  <script>
    const backendUrlInput = document.getElementById('backend-url');
    const authEmailInput = document.getElementById('auth-email');
    const authPasswordInput = document.getElementById('auth-password');
    const loginBtn = document.getElementById('login-btn');
    const authStatusEl = document.getElementById('auth-status');

    const connectedSection = document.getElementById('connected-section');
    const authSection = document.getElementById('auth-section');
    const connectedUserName = document.getElementById('connected-user-name');
    const resyncBtn = document.getElementById('resync-btn');
    const connectStatusEl = document.getElementById('connect-status');
    const extLogoutBtn = document.getElementById('ext-logout-btn');

    let savedToken = '';
    let savedBackendUrl = '';

    // Load saved state
    chrome.storage.local.get(['backendUrl', 'authToken', 'userName'], (result) => {
      if (result.backendUrl) {
        backendUrlInput.value = result.backendUrl;
        savedBackendUrl = result.backendUrl;
      } else {
        backendUrlInput.value = 'http://localhost:8080';
      }

      if (result.authToken) {
        savedToken = result.authToken;
        // Verify token is still valid
        verifyAndShowConnected(result.backendUrl || 'http://localhost:8080', result.authToken, result.userName || '');
      }
    });

    backendUrlInput.addEventListener('change', () => {
      chrome.storage.local.set({ backendUrl: backendUrlInput.value.trim() });
    });

    function setAuthStatus(text, type, showSpinner) {
      authStatusEl.className = 'status ' + type;
      authStatusEl.textContent = '';
      if (showSpinner) {
        var spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-label', 'Loading');
        authStatusEl.appendChild(spinner);
        authStatusEl.appendChild(document.createTextNode(' ' + text));
      } else {
        authStatusEl.textContent = text;
      }
    }

    function setConnectStatus(text, type, showSpinner) {
      connectStatusEl.className = 'status ' + type;
      connectStatusEl.textContent = '';
      if (showSpinner) {
        var spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-label', 'Loading');
        connectStatusEl.appendChild(spinner);
        connectStatusEl.appendChild(document.createTextNode(' ' + text));
      } else {
        connectStatusEl.textContent = text;
      }
    }

    async function verifyAndShowConnected(backendUrl, token, userName) {
      try {
        const res = await fetch(backendUrl.replace(/\/+$/, '') + '/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        if (res.ok) {
          const data = await res.json();
          savedToken = token;
          savedBackendUrl = backendUrl;
          connectedUserName.textContent = data.user.name;
          authSection.classList.add('hidden');
          connectedSection.classList.remove('hidden');
        }
      } catch (e) {
        // Token invalid, stay on login
      }
    }

    loginBtn.addEventListener('click', async () => {
      const backendUrl = backendUrlInput.value.trim().replace(/\/+$/, '');
      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;

      if (!backendUrl) {
        setAuthStatus('Please enter a backend URL', 'error');
        return;
      }
      if (!email || !password) {
        setAuthStatus('Please enter email and password', 'error');
        return;
      }

      try { new URL(backendUrl); } catch(e) { setAuthStatus('Invalid backend URL', 'error'); return; }

      if (!backendUrl.startsWith('https://') && !backendUrl.includes('localhost') && !backendUrl.includes('127.0.0.1')) {
        setAuthStatus('Warning: sending credentials over insecure HTTP!', 'error');
      }

      loginBtn.disabled = true;
      setAuthStatus('Logging in...', 'info', true);

      try {
        const res = await fetch(backendUrl + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(errData.detail || 'Login failed');
        }

        const data = await res.json();
        savedToken = data.token;
        savedBackendUrl = backendUrl;

        chrome.storage.local.set({
          backendUrl: backendUrl,
          authToken: data.token,
          userName: data.user.name,
        });

        connectedUserName.textContent = data.user.name;

        // Now auto-sync Uber session
        setAuthStatus('Syncing Uber session...', 'info', true);
        await captureAndSendSession(backendUrl, data.token);

        authSection.classList.add('hidden');
        connectedSection.classList.remove('hidden');
        setConnectStatus('Logged in and session synced!', 'success');
      } catch (err) {
        setAuthStatus('Error: ' + err.message, 'error');
      } finally {
        loginBtn.disabled = false;
      }
    });

    resyncBtn.addEventListener('click', async () => {
      resyncBtn.disabled = true;
      setConnectStatus('Syncing session...', 'info', true);

      try {
        await captureAndSendSession(savedBackendUrl, savedToken);
        setConnectStatus('Session synced!', 'success');
      } catch (err) {
        setConnectStatus('Error: ' + err.message, 'error');
      } finally {
        resyncBtn.disabled = false;
      }
    });

    extLogoutBtn.addEventListener('click', () => {
      savedToken = '';
      savedBackendUrl = '';
      chrome.storage.local.remove(['authToken', 'userName']);
      connectedSection.classList.add('hidden');
      authSection.classList.remove('hidden');
      authPasswordInput.value = '';
      setAuthStatus('', '');
    });

    async function captureAndSendSession(backendUrl, token) {
      // 1. Get all Uber cookies
      const cookies = await chrome.cookies.getAll({ domain: '.uber.com' });

      if (cookies.length === 0) {
        throw new Error('No Uber cookies found. Are you logged in to uber.com?');
      }

      // 2. Get the active tab
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });

      let storageData = { localStorage: {}, sessionStorage: {}, url: '', userAgent: '' };

      if (tab && tab.url && tab.url.includes('uber.com')) {
        const injectionResults = await chrome.scripting.executeScript({
          target: { tabId: tab.id },
          func: () => {
            const ls = {};
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              ls[key] = localStorage.getItem(key);
            }
            const ss = {};
            for (let i = 0; i < sessionStorage.length; i++) {
              const key = sessionStorage.key(i);
              ss[key] = sessionStorage.getItem(key);
            }
            return {
              localStorage: ls,
              sessionStorage: ss,
              url: window.location.href,
              userAgent: navigator.userAgent,
            };
          },
        });
        storageData = injectionResults[0].result;
      }

      // 3. Package and send
      const payload = {
        cookies: cookies,
        localStorage: storageData.localStorage,
        sessionStorage: storageData.sessionStorage,
        url: storageData.url,
        userAgent: storageData.userAgent,
        timestamp: new Date().toISOString(),
      };

      const response = await fetch(backendUrl.replace(/\/+$/, '') + '/api/profile/import', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(errText || response.statusText);
      }

      return await response.json();
    }
  </script>
</body>
</html>
